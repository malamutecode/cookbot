[project]
name = "delivery-shops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "structlog>=24.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits a real delivery-shop feed over the network. Excluded from the fast unit run via `-m 'not integration'`.",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["delivery_shops"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
