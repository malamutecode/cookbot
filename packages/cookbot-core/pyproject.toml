[project]
name = "cookbot-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[duckduckgo,openai,web-fetch]>=1.102.0",
    "pydantic-settings>=2.3",
    "google-cloud-firestore>=2.16",
    "asyncpg>=0.29",
    "openai>=1.35",
    "structlog>=24.2",
    "ddgs>=9.14.4",
    "tzdata>=2026.2",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (OpenAI, DuckDuckGo, Firestore emulator). Excluded from the fast unit run via `-m 'not integration'`.",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["cookbot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
