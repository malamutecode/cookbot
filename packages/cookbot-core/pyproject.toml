[project]
name = "cookbot-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[duckduckgo,openai,web-fetch]>=1.102.0",
    "pydantic-settings>=2.3",
    "google-cloud-firestore>=2.16",
    "asyncpg>=0.29",
    "openai>=1.35",
    "structlog>=24.2",
    "ddgs>=9.14.4",
    "tzdata>=2026.2",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (OpenAI, DuckDuckGo, Firestore emulator). Excluded from the fast unit run via `-m 'not integration'`.",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["cookbot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
# Pinned so `uv run pyright` gives the same answer everywhere (CI, any machine).
pythonVersion = "3.12"
# "standard", not "strict": the recorded baseline was measured at this level, and
# strict reports ~650 errors (mostly untyped test fixtures) — a number nobody acts
# on. CLAUDE.md asks for strict types on new public functions; the ratchet below
# is what actually holds the line.
typeCheckingMode = "standard"
include = ["cookbot", "tests"]
exclude = [".venv", "**/__pycache__"]
# Baseline: 18 errors, all in tests/ (see tools/pyright_baseline.json). Judge a
# change by whether it MOVES that count — `tools/check_pyright.py` enforces it.

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
]
