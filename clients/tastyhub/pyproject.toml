[project]
name = "cookbot-tastyhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cookbot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
cookbot-core = { path = "../../packages/cookbot-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
