[project]
name = "cookbot-tastyhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cookbot-core",
    "delivery-shops",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "firebase-admin>=6.5",
    # Direct import of pydantic_ai.messages in the WS handler; extras come via cookbot-core.
    "pydantic-ai-slim>=1.102.0",
]

[tool.uv.sources]
cookbot-core = { path = "../../packages/cookbot-core", editable = true }
delivery-shops = { path = "../../packages/delivery-shops", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
# Pinned so `uv run pyright` gives the same answer everywhere (CI, any machine).
pythonVersion = "3.12"
# "standard", not "strict" — see the note in packages/cookbot-core/pyproject.toml.
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "**/__pycache__"]
# Baseline: 31 errors — 30 in tests/, plus one in app/config/settings.py where
# pyright cannot see that pydantic-settings fills the required fields from env
# (see tools/pyright_baseline.json). Judge a change by whether it MOVES that
# count — `tools/check_pyright.py` enforces it.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.406",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
