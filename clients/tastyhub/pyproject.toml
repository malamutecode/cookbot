[project]
name = "cookbot-tastyhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cookbot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "firebase-admin>=6.5",
    # Direct import of pydantic_ai.messages in the WS handler; extras come via cookbot-core.
    "pydantic-ai-slim>=1.102.0",
]

[tool.uv.sources]
cookbot-core = { path = "../../packages/cookbot-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
